<script>
// Persistent progress is optional. Existing saves are retained until explicitly deleted.
window.HubStorage = (() => {
    const keys = ['ua_stats', 'ua_highscores', 'ua_language', 'snake17_highscore', 'ua_audio', 'ua_feedback'];
    const memory = new Map();
    let enabled = false, available = true;
    try { enabled = localStorage.getItem('ua_storage_choice') === 'on'; } catch (_) { available = false; }
    return {
        keys, get enabled() { return enabled; }, get available() { return available; },
        getItem(key) {
            if (!keys.includes(key)) return null;
            if (enabled) { try { const value = localStorage.getItem(key); if (value !== null) return value; } catch (_) { available = false; } }
            return memory.get(key) ?? null;
        },
        setItem(key, value) {
            if (!keys.includes(key)) return;
            memory.set(key, String(value));
            if (enabled) { try { localStorage.setItem(key, String(value)); } catch (_) { available = false; } }
        },
        enable() {
            try {
                localStorage.setItem('ua_storage_choice', 'on');
                enabled = true; available = true;
                return true;
            } catch (_) { available = false; return false; }
        },
        disable() {
            keys.forEach(key => { const value = this.getItem(key); if (value !== null) memory.set(key, value); });
            enabled = false;
            try { localStorage.removeItem('ua_storage_choice'); } catch (_) { available = false; }
        },
        clear() {
            memory.clear(); enabled = false;
            let success = true;
            try { [...keys, 'ua_storage_choice'].forEach(key => localStorage.removeItem(key)); } catch (_) { success = false; available = false; }
            try { if (typeof sessionStorage !== 'undefined') sessionStorage.removeItem('ua_online_session'); } catch (_) { success = false; }
            return success;
        }
    };
})();

</script>

// --- Eigene Rect-Klasse ---
class Rect {
    constructor(x, y, w, h) { this.x = x; this.y = y; this.w = Math.max(0, w); this.h = Math.max(0, h); }
    get left() { return this.x; }
    get right() { return this.x + this.w; }
    get top() { return this.y; }
    get bottom() { return this.y + this.h; }
    get centerx() { return this.x + this.w/2; }
    get centery() { return this.y + this.h/2; }
    collidepoint(px, py) { return px >= this.left && px <= this.right && py >= this.top && py <= this.bottom; }
    inflate(dw, dh) { return new Rect(this.x - dw/2, this.y - dh/2, this.w + dw, this.h + dh); }
    collidelist(rects) {
        for(let i=0; i<rects.length; i++){
            let r = rects[i];
            if(Math.max(this.left, r.left) < Math.min(this.right, r.right) && Math.max(this.top, r.top) < Math.min(this.bottom, r.bottom)) return i;
        }
        return -1;
    }
}

const FPS = 60;
const GAME_TIME = 5 * 60;
const TIME_STEP = 1000 / FPS;

// Input & State
let keys = {};
let mousePos = {x: 0, y: 0};
let mouseButtons = {left: false};
let clickTriggered = false;
let vjoys = { fid1: null, fid2: null, p1: null, p2: null, base1: [0,0], base2: [0,0] };
let lastTouchY = null;
const pauseBtnRect = new Rect(WIDTH - 120, 20, 80, 80);

function getEventPos(e) {
    let rect = canvas.getBoundingClientRect();
    let cx = e.clientX || (e.touches && e.touches.length > 0 ? e.touches[0].clientX : 0);
    let cy = e.clientY || (e.touches && e.touches.length > 0 ? e.touches[0].clientY : 0);
    return {
        x: (cx - rect.left) * (WIDTH / rect.width),
        y: (cy - rect.top) * (HEIGHT / rect.height)
    };
}

window.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('#infoPanel')) return;
    keys[e.code] = true;
    if (state === "HUB") {
        if(e.code==='Space' || e.code==='Enter') state = "MENU";
    } else if (state === "MENU") {
        if(e.code==='Digit1' || e.code==='Numpad1' || e.code==='KeyM') mode_idx = (mode_idx + 1) % MODES.length;
        if(e.code==='Digit2' || e.code==='Numpad2' || e.code==='KeyN') map_idx = (map_idx + 1) % MAPS.length;
        if(e.code==='KeyB') boss_enabled = !boss_enabled;
        if(e.code==='KeyP') { p2_is_bot=!p2_is_bot; stats.p2_bot=p2_is_bot; save_stats(stats); }
        if(e.code==='KeyA') p1_skin_idx = (p1_skin_idx-1+SKINS.length)%SKINS.length;
        if(e.code==='KeyD') p1_skin_idx = (p1_skin_idx+1)%SKINS.length;
        if(e.code==='KeyW') p1_color_idx = (p1_color_idx+1)%COLORS.length;
        if(e.code==='KeyS') p1_color_idx = (p1_color_idx-1+COLORS.length)%COLORS.length;
        if(![1,3].includes(mode_idx)) {
            if(e.code==='ArrowLeft') p2_skin_idx = (p2_skin_idx-1+SKINS.length)%SKINS.length;
            if(e.code==='ArrowRight') p2_skin_idx = (p2_skin_idx+1)%SKINS.length;
            if(e.code==='ArrowUp') p2_color_idx = (p2_color_idx+1)%COLORS.length;
            if(e.code==='ArrowDown') p2_color_idx = (p2_color_idx-1+COLORS.length)%COLORS.length;
        }
        if(e.code==='Space') clickTriggered = true;
    } else if(["HIGHSCORES","TUTORIAL","ACHIEVEMENTS","CREDITS","SETTINGS"].includes(state) && (e.code==='Escape'||e.code==='Space')) {
        state="MENU";
    } else if(state === "LEGAL" && (e.code==='Escape'||e.code==='Space')) {
        state="HUB";
    } else if(state === "ACHIEVEMENTS" || state === "LEGAL") {
        if(e.code==='ArrowUp') scroll_y += 50;
        if(e.code==='ArrowDown') scroll_y -= 50;
    } else if(state === "PLAYING" && e.code==='Escape') {
        state="PAUSED"; pause_start_tick = Date.now();
    } else if(state === "PAUSED" && (e.code==='Escape'||e.code==='Space')) {
        state="PLAYING"; paused_time_total += Date.now() - pause_start_tick;
    } else if(state === "GAME_OVER" && e.code==='Space') {
        state="MENU";
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

canvas.addEventListener('mousemove', e => mousePos = getEventPos(e));
canvas.addEventListener('mousedown', e => { 
    if(e.button === 0) { mouseButtons.left = true; clickTriggered = true; mousePos = getEventPos(e); } 
});
canvas.addEventListener('mouseup', e => { if(e.button === 0) mouseButtons.left = false; });

// --- Robuste Touch-Steuerung ---
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    stats.touch_ctrl = true; 
    save_stats(stats);
    
    let rect = canvas.getBoundingClientRect();
    for(let i=0; i<e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        let lx = (t.clientX - rect.left) * (WIDTH / rect.width);
        let ly = (t.clientY - rect.top) * (HEIGHT / rect.height);
        
        if (state === "PLAYING") {
            if (pauseBtnRect.collidepoint(lx, ly)) {
                state = "PAUSED"; pause_start_tick = Date.now();
            } else {
                if (lx < WIDTH/2 && vjoys.fid1 === null) {
                    vjoys.fid1 = t.identifier; vjoys.base1 = [lx, ly]; vjoys.p1 = [lx, ly];
                } else if (lx >= WIDTH/2 && vjoys.fid2 === null) {
                    vjoys.fid2 = t.identifier; vjoys.base2 = [lx, ly]; vjoys.p2 = [lx, ly];
                }
            }
        } else {
            mousePos = {x: lx, y: ly};
            clickTriggered = true;
            lastTouchY = ly;
        }
    }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    let rect = canvas.getBoundingClientRect();
    for(let i=0; i<e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        let lx = (t.clientX - rect.left) * (WIDTH / rect.width);
        let ly = (t.clientY - rect.top) * (HEIGHT / rect.height);
        
        if ((state === "ACHIEVEMENTS" || state === "LEGAL") && lastTouchY !== null) {
            scroll_y += (ly - lastTouchY);
            lastTouchY = ly;
        }
        if (state !== "PLAYING") { mousePos = {x: lx, y: ly}; }

        if (t.identifier === vjoys.fid1) vjoys.p1 = [lx, ly];
        else if (t.identifier === vjoys.fid2) vjoys.p2 = [lx, ly];
    }
}, {passive: false});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for(let i=0; i<e.changedTouches.length; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === vjoys.fid1) { vjoys.fid1 = null; vjoys.p1 = null; }
        else if (t.identifier === vjoys.fid2) { vjoys.fid2 = null; vjoys.p2 = null; }
    }
    if (e.touches.length === 0) lastTouchY = null;
}, {passive: false});

canvas.addEventListener('wheel', e => { if(state === "ACHIEVEMENTS" || state === "LEGAL") { scroll_y += (e.deltaY > 0 ? -40 : 40); }});

// ============================================================
//  RENDER HELPER
// ============================================================

function toRGB(c, alpha=1) { return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`; }

const BACKGROUND = document.createElement('canvas');
BACKGROUND.width = WIDTH; BACKGROUND.height = HEIGHT;
const VIGNETTE = document.createElement('canvas');
VIGNETTE.width = WIDTH; VIGNETTE.height = HEIGHT;

function initStatics() {
    let bCtx = BACKGROUND.getContext('2d');
    let grad = bCtx.createLinearGradient(0, 0, 0, HEIGHT);
    grad.addColorStop(0, toRGB(BG_TOP));
    grad.addColorStop(1, toRGB(BG_BOTTOM));
    bCtx.fillStyle = grad;
    bCtx.fillRect(0, 0, WIDTH, HEIGHT);
    
    bCtx.strokeStyle = toRGB(GRID_COLOR);
    bCtx.beginPath();
    for (let x=0; x<WIDTH; x+=60) { bCtx.moveTo(x, 0); bCtx.lineTo(x, HEIGHT); }
    for (let y=0; y<HEIGHT; y+=60) { bCtx.moveTo(0, y); bCtx.lineTo(WIDTH, y); }
    bCtx.stroke();
    
    bCtx.globalCompositeOperation = 'lighter';
    bCtx.drawImage(getGlow(520, [60,90,180], 22), -180, -220);
    bCtx.drawImage(getGlow(560, [150,60,130], 18), WIDTH-820, HEIGHT-780);
    bCtx.globalCompositeOperation = 'source-over';

    let vCtx = VIGNETTE.getContext('2d');
    let vGrad = vCtx.createRadialGradient(WIDTH/2, HEIGHT/2, HEIGHT*0.4, WIDTH/2, HEIGHT/2, Math.hypot(WIDTH,HEIGHT)/2);
    vGrad.addColorStop(0, "rgba(0,0,0,0)");
    vGrad.addColorStop(1, "rgba(0,0,0,0.85)");
    vCtx.fillStyle = vGrad;
    vCtx.fillRect(0,0,WIDTH,HEIGHT);
}

const _glowCache = {};
function getGlow(radius, color, max_alpha=70, layers=10) {
    radius = Math.max(2, Math.floor(radius));
    let key = `${radius},${color.join('.')},${max_alpha}`;
    if (_glowCache[key]) return _glowCache[key];
    
    let c = document.createElement('canvas');
    c.width = radius*2; c.height = radius*2;
    let cx = c.getContext('2d');
    
    for (let i=layers; i>0; i--) {
        let alpha = max_alpha * Math.pow((layers-i+1)/layers, 2) / 255;
        let r = radius * i / layers;
        cx.beginPath();
        cx.arc(radius, radius, r, 0, Math.PI*2);
        cx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
        cx.fill();
    }
    _glowCache[key] = c;
    return c;
}

function blitGlow(context, x, y, radius, color, max_alpha=70) {
    let g = getGlow(radius, color, max_alpha);
    context.drawImage(g, Math.floor(x - g.width/2), Math.floor(y - g.height/2));
}

function drawSoftShadow(context, x, y, radius) {
    let g = getGlow(Math.floor(radius*1.15), BLACK, 150, 7);
    context.drawImage(g, Math.floor(x - g.width/2 + 6), Math.floor(y - g.height/2 + 9));
}

function roundRect(context, x, y, w, h, r) {
    context.beginPath();
    context.moveTo(x + r, y);
    context.lineTo(x + w - r, y); context.quadraticCurveTo(x + w, y, x + w, y + r);
    context.lineTo(x + w, y + h - r); context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    context.lineTo(x + r, y + h); context.quadraticCurveTo(x, y + h, x, y + h - r);
    context.lineTo(x, y + r); context.quadraticCurveTo(x, y, x + r, y);
    context.closePath();
}

function drawPanel(context, rect, alpha=195, radius=16, border=true) {
    context.fillStyle = toRGB(PANEL_BG, alpha/255);
    roundRect(context, rect.x, rect.y, rect.w, rect.h, radius);
    context.fill();
    if (border) {
        context.lineWidth = 2;
        context.strokeStyle = "rgba(255,255,255,0.15)";
        context.stroke();
    }
}

function drawWall(context, rect) {
    context.fillStyle = "rgba(0,0,0,0.43)";
    roundRect(context, rect.x + 7, rect.y + 10, rect.w, rect.h, 12);
    context.fill();
    
    context.fillStyle = toRGB(WALL_COLOR);
    roundRect(context, rect.x, rect.y, rect.w, rect.h, 12);
    context.fill();
    
    context.fillStyle = toRGB(WALL_TOP);
    roundRect(context, rect.x + 3, rect.y + 3, rect.w - 6, Math.max(6, rect.h/5), 9);
    context.fill();
    
    context.lineWidth = 2;
    context.strokeStyle = toRGB(WALL_EDGE);
    roundRect(context, rect.x, rect.y, rect.w, rect.h, 12);
    context.stroke();
}

function textCenter(context, text, font, color, cx, y) {
    context.font = font; context.fillStyle = color;
    context.textAlign = "center"; context.textBaseline = "top";
    context.fillText(text, cx, y);
}
function drawText(context, text, font, color, x, y) {
    context.font = font; context.fillStyle = color;
    context.textAlign = "left"; context.textBaseline = "top";
    context.fillText(text, x, y);
}

let particles = [];
function addParticle(x, y, color, speed, size=5, count=10) {
    for(let i=0; i<count; i++) {
        let vx = (Math.random()-0.5)*2*speed;
        let vy = (Math.random()-0.5)*2*speed;
        let life = 20 + Math.random()*20;
        particles.push({x:x, y:y, vx:vx, vy:vy, size:size, color:color, life:life, maxLife:life});
    }
}
function drawParticles(context) {
    for(let i = particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if(p.life <= 0) { particles.splice(i, 1); continue; }
        context.beginPath();
        let s = Math.max(0, p.size * (p.life/p.maxLife));
        context.arc(p.x, p.y, s, 0, Math.PI*2);
        context.fillStyle = toRGB(p.color, p.color.length===4 ? p.color[3] : 1);
        context.fill();
    }
}

function drawSkinShape(context, x, y, radius, color, skinName, width=0) {
    context.beginPath();
    if(skinName === "Kreis") context.arc(x, y, radius, 0, Math.PI*2);
    else if(skinName === "Quadrat") { let s=radius*0.85; context.rect(x-s, y-s, s*2, s*2); }
    else if(skinName === "Diamant") { context.moveTo(x, y-radius-2); context.lineTo(x+radius+2, y); context.lineTo(x, y+radius+2); context.lineTo(x-radius-2, y); context.closePath(); }
    else if(skinName === "Sechseck") {
        for(let i=0; i<6; i++) {
            let px = x + Math.cos(i*Math.PI/3)*(radius+2);
            let py = y + Math.sin(i*Math.PI/3)*(radius+2);
            if(i===0) context.moveTo(px,py); else context.lineTo(px,py);
        } context.closePath();
    }
    else if(skinName === "Dreieck") { context.moveTo(x, y-radius-2); context.lineTo(x+radius+4, y+radius); context.lineTo(x-radius-4, y+radius); context.closePath(); }
    else if(skinName === "Stern") {
        for(let i=0; i<10; i++) {
            let r = i%2===0 ? radius+4 : Math.floor(radius/2);
            let px = x + Math.cos((i*36-90)*Math.PI/180)*r;
            let py = y + Math.sin((i*36-90)*Math.PI/180)*r;
            if(i===0) context.moveTo(px,py); else context.lineTo(px,py);
        } context.closePath();
    }
    else if(skinName === "Kreuz") {
        let w = radius/2.5, r = radius+2;
        let pts = [[x-w,y-r],[x+w,y-r],[x+w,y-w],[x+r,y-w],[x+r,y+w],[x+w,y+w],[x+w,y+r],[x-w,y+r],[x-w,y+w],[x-r,y+w],[x-r,y-w],[x-w,y-w]];
        context.moveTo(pts[0][0], pts[0][1]);
        for(let i=1; i<pts.length; i++) context.lineTo(pts[i][0], pts[i][1]);
        context.closePath();
    }
    
    if(width>0) { context.lineWidth = width; context.strokeStyle = toRGB(color, color[3]||1); context.stroke(); }
    else { context.fillStyle = toRGB(color, color[3]||1); context.fill(); }
}

class Player {
    constructor(x, y, color, controls, name, skin, joy_id=null, is_bot=false) {
        this.x = x; this.y = y; this.base_radius = 30; this.alive = true;
        this.radius = 30; this.speed = 8; this.normal_speed = 8;
        this.base_color = color; this.controls = controls; this.skin = skin; this.name = name;
        this.joy_id = joy_id; this.is_bot = is_bot; this.bot_speed_factor = 1.0;
        this.times_caught = 0; this.speed_timer = 0; this.freeze_timer = 0; this.ghost_timer = 0; this.shrink_timer = 0;
        this.has_shield = false; this.revive_timer = 0; this.rampage_timer = 0; this.score = 0;
    }

    get_wall_penetration(px, py, obstacles) {
        let pen = 0;
        for(let obs of obstacles) {
            let cx = Math.max(obs.left, Math.min(px, obs.right));
            let cy = Math.max(obs.top, Math.min(py, obs.bottom));
            let dist_sq = (px - cx)**2 + (py - cy)**2;
            if(dist_sq < this.radius**2) {
                let dist = Math.sqrt(dist_sq);
                if(dist === 0) pen += this.radius + Math.min(px - obs.left, obs.right - px, py - obs.top, obs.bottom - py);
                else pen += this.radius - dist;
            }
        }
        return pen;
    }

    move(obstacles, is_catcher=false, vjoy_dir=[0,0], mouse_target=null) {
        if(!this.alive) { if(this.revive_timer > 0) this.revive_timer--; return; }
        if(this.freeze_timer > 0) { this.freeze_timer--; return; }

        if(this.shrink_timer > 0) { this.shrink_timer--; this.radius = 15; this.speed = this.normal_speed * 1.3; }
        else { this.radius = this.base_radius; this.speed = this.normal_speed; }

        if(is_catcher) this.speed *= 1.05;
        if(this.is_bot) this.speed *= this.bot_speed_factor;
        
        if(this.speed_timer > 0) { this.speed_timer--; this.speed *= 1.6; addParticle(this.x, this.y, YELLOW, 1, 3, 1); }
        if(this.rampage_timer > 0) { this.rampage_timer--; addParticle(this.x, this.y, RED, 1, 4, 1); }
        if(this.ghost_timer > 0) { this.ghost_timer--; addParticle(this.x, this.y, WHITE, 0.5, 2, 1); }

        let dx=0, dy=0;
        if(vjoy_dir[0]!==0 || vjoy_dir[1]!==0) { dx += vjoy_dir[0]*this.speed; dy += vjoy_dir[1]*this.speed; }

        if(mouse_target !== null && !this.is_bot && !stats.touch_ctrl) {
            let tx = mouse_target.x, ty = mouse_target.y;
            let ddx = tx - this.x, ddy = ty - this.y;
            let d = Math.hypot(ddx, ddy);
            if(d > this.radius * 0.5) { dx += (ddx/d)*this.speed; dy += (ddy/d)*this.speed; }
        }

        if(!this.is_bot) {
            if(keys[this.controls.left]) dx -= this.speed;
            if(keys[this.controls.right]) dx += this.speed;
            if(keys[this.controls.up]) dy -= this.speed;
            if(keys[this.controls.down]) dy += this.speed;

            let gps = (navigator.getGamepads && typeof navigator.getGamepads === 'function') ? navigator.getGamepads() : [];
            if(this.joy_id !== null && gps[this.joy_id]) {
                let gp = gps[this.joy_id];
                if(gp && gp.axes.length >= 2) {
                    if(Math.abs(gp.axes[0]) > 0.2) dx += gp.axes[0]*this.speed;
                    if(Math.abs(gp.axes[1]) > 0.2) dy += gp.axes[1]*this.speed;
                }
            }
        }

        if(dx > this.speed) dx = this.speed; else if(dx < -this.speed) dx = -this.speed;
        if(dy > this.speed) dy = this.speed; else if(dy < -this.speed) dy = -this.speed;

        if(dx !== 0) {
            let pen_old = this.get_wall_penetration(this.x, this.y, obstacles);
            this.x += dx;
            if(this.x - this.radius < 0 || this.x + this.radius > WIDTH) this.x -= dx;
            else if(this.ghost_timer === 0) {
                let pen_new = this.get_wall_penetration(this.x, this.y, obstacles);
                if((pen_old===0 && pen_new>0) || (pen_old>0 && pen_new>=pen_old)) this.x -= dx;
            }
        }
        if(dy !== 0) {
            let pen_old = this.get_wall_penetration(this.x, this.y, obstacles);
            this.y += dy;
            if(this.y - this.radius < 0 || this.y + this.radius > HEIGHT) this.y -= dy;
            else if(this.ghost_timer === 0) {
                let pen_new = this.get_wall_penetration(this.x, this.y, obstacles);
                if((pen_old===0 && pen_new>0) || (pen_old>0 && pen_new>=pen_old)) this.y -= dy;
            }
        }
    }

    draw(ctx, status) {
        if(!this.alive) return;
        let color = status===-1 ? NEUTRAL_COLOR : (status===0 ? RED : this.base_color);
        drawSoftShadow(ctx, this.x, this.y, this.radius);
        if(this.ghost_timer > 0) {
            drawSkinShape(ctx, this.x, this.y, this.radius, GHOST_WHITE, this.skin); return;
        }

        blitGlow(ctx, this.x, this.y, this.radius*2.2, color, 80);

        if(this.freeze_timer > 0) {
            blitGlow(ctx, this.x, this.y, this.radius*2.6, ICE_BLUE, 120);
            drawSkinShape(ctx, this.x, this.y, this.radius+10, ICE_BLUE, this.skin);
        }
        if(this.rampage_timer > 0) drawSkinShape(ctx, this.x, this.y, this.radius+9, RED, this.skin, 5);
        if(this.has_shield) drawSkinShape(ctx, this.x, this.y, this.radius+9, CYAN, this.skin, 4);
        if(this.speed_timer > 0) drawSkinShape(ctx, this.x, this.y, this.radius+7, YELLOW, this.skin, 2);

        drawSkinShape(ctx, this.x, this.y, this.radius, color, this.skin);
        
        let hl = getGlow(this.radius*0.55, [255,255,255], 90, 6);
        ctx.drawImage(hl, Math.floor(this.x - this.radius*0.75), Math.floor(this.y - this.radius*0.85));
        drawSkinShape(ctx, this.x, this.y, this.radius, WHITE, this.skin, 3);
    }
}

class Zombie {
    constructor(x, y) { this.x=x; this.y=y; this.radius=27; this.speed=2.5; this.freeze_timer=0; }
    move_towards(p1, p2, obstacles) {
        if(this.freeze_timer > 0) { this.freeze_timer--; return; }
        let t = null, min_d = Infinity;
        if(p1 && p1.alive) { min_d = Math.hypot(p1.x-this.x, p1.y-this.y); t = p1; }
        if(p2 && p2.alive && Math.hypot(p2.x-this.x, p2.y-this.y) < min_d) t = p2;
        if(!t) return;
        let dist = Math.hypot(t.x-this.x, t.y-this.y);
        if(dist > 0) {
            let vx = ((t.x-this.x)/dist)*this.speed, vy = ((t.y-this.y)/dist)*this.speed;
            this.x += vx;
            if(obstacles.some(o => Math.pow(this.x - Math.max(o.left, Math.min(this.x, o.right)),2) + Math.pow(this.y - Math.max(o.top, Math.min(this.y, o.bottom)),2) < this.radius**2)) this.x -= vx;
            this.y += vy;
            if(obstacles.some(o => Math.pow(this.x - Math.max(o.left, Math.min(this.x, o.right)),2) + Math.pow(this.y - Math.max(o.top, Math.min(this.y, o.bottom)),2) < this.radius**2)) this.y -= vy;
        }
    }
    draw(ctx) {
        drawSoftShadow(ctx, this.x, this.y, this.radius);
        blitGlow(ctx, this.x, this.y, this.radius*1.9, ZOMBIE_GREEN, 60);
        if(this.freeze_timer > 0) {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius+6, 0, Math.PI*2); ctx.fillStyle=toRGB(ICE_BLUE); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle=toRGB(ZOMBIE_GREEN); ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle=toRGB([25,90,45]); ctx.stroke();
        ctx.beginPath(); ctx.arc(this.x-8, this.y-6, 5, 0, Math.PI*2); ctx.fillStyle=toRGB([200,30,30]); ctx.fill();
        ctx.beginPath(); ctx.arc(this.x+8, this.y-6, 5, 0, Math.PI*2); ctx.fill();
    }
}

class Boss {
    constructor(x, y) {
        this.x=x; this.y=y; this.radius=70; this.hp=1000; this.max_hp=1000;
        this.base_speed = 3.2; this.stun_timer=0; this.slow_timer=0; this.burn_timer=0;
        this.state = 'shoot'; this.state_timer=0; this.dash_vx=0; this.dash_vy=0;
    }
    update(p1, p2, projectiles) {
        let speed = this.base_speed;
        if(this.stun_timer>0) { this.stun_timer--; speed = 0; }
        else if(this.slow_timer>0) { this.slow_timer--; speed = this.base_speed * 0.4; }

        if(this.burn_timer>0) {
            this.burn_timer--;
            if(this.burn_timer%10===0) { this.hp-=2; addParticle(this.x, this.y, ORANGE, 3, 5, 1); }
        }

        this.state_timer++;
        if(this.state === 'shoot') {
            if(speed > 0) {
                let t=null, min_d=Infinity;
                if(p1 && p1.alive) { min_d = Math.hypot(p1.x-this.x, p1.y-this.y); t=p1; }
                if(p2 && p2.alive && Math.hypot(p2.x-this.x, p2.y-this.y) < min_d) t=p2;
                if(t) {
                    let d = Math.hypot(t.x-this.x, t.y-this.y);
                    if(d>0) { this.x += ((t.x-this.x)/d)*speed; this.y += ((t.y-this.y)/d)*speed; }
                }
            }
            if(this.state_timer > 180) { this.state = 'nova'; this.state_timer = 0; }
            else if(this.state_timer%60===0 && speed>0) {
                let t = (p1 && p1.alive && (!p2 || !p2.alive || Math.random()>0.5)) ? p1 : p2;
                if(t && t.alive) {
                    let d = Math.hypot(t.x-this.x, t.y-this.y);
                    if(d>0) projectiles.push(new BossProjectile(this.x, this.y, ((t.x-this.x)/d)*6.5, ((t.y-this.y)/d)*6.5));
                }
            }
        } else if(this.state === 'nova') {
            if(this.state_timer === 30 && speed>0) {
                for(let a=0; a<360; a+=45) {
                    let rad = a * Math.PI/180;
                    projectiles.push(new BossProjectile(this.x, this.y, Math.cos(rad)*7.5, Math.sin(rad)*7.5));
                }
            }
            if(this.state_timer > 60) { this.state = 'dash_aim'; this.state_timer = 0; }
        } else if(this.state === 'dash_aim') {
            if(this.state_timer === 45 && speed>0) {
                let t=null, min_d=Infinity;
                if(p1 && p1.alive) { min_d = Math.hypot(p1.x-this.x, p1.y-this.y); t=p1; }
                if(p2 && p2.alive && Math.hypot(p2.x-this.x, p2.y-this.y) < min_d) t=p2;
                if(t) {
                    let d = Math.hypot(t.x-this.x, t.y-this.y);
                    if(d>0) { this.dash_vx = ((t.x-this.x)/d)*19; this.dash_vy = ((t.y-this.y)/d)*19; this.state='dash'; this.state_timer=0; }
                }
            } else if(this.state_timer > 45) { this.state='shoot'; this.state_timer=0; }
        } else if(this.state === 'dash') {
            if(speed>0) { this.x+=this.dash_vx; this.y+=this.dash_vy; addParticle(this.x, this.y, RED, 1, 8, 2); }
            if(this.state_timer > 20) { this.state='shoot'; this.state_timer=0; }
        }
    }
    draw(ctx) {
        drawSoftShadow(ctx, this.x, this.y, this.radius);
        blitGlow(ctx, this.x, this.y, this.radius*2.1, BOSS_COLOR, 90);
        ctx.beginPath();
        if(this.burn_timer>0) { ctx.arc(this.x, this.y, this.radius+10, 0, Math.PI*2); ctx.fillStyle=toRGB(ORANGE); ctx.fill(); ctx.beginPath(); }
        if(this.slow_timer>0) { ctx.arc(this.x, this.y, this.radius+7, 0, Math.PI*2); ctx.fillStyle=toRGB(ICE_BLUE); ctx.fill(); ctx.beginPath(); }
        if(this.stun_timer>0) { ctx.arc(this.x, this.y, this.radius+14, 0, Math.PI*2); ctx.strokeStyle=toRGB(PURPLE); ctx.lineWidth=6; ctx.stroke(); ctx.beginPath(); }
        if(this.state==='dash_aim') { ctx.arc(this.x, this.y, this.radius+7+Math.sin(this.state_timer*0.5)*14, 0, Math.PI*2); ctx.fillStyle=toRGB(RED); ctx.fill(); ctx.beginPath(); }

        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle=toRGB(BOSS_COLOR); ctx.fill();
        ctx.strokeStyle=toRGB([60,8,25]); ctx.lineWidth=6; ctx.stroke();
        
        ctx.beginPath(); ctx.arc(this.x-24, this.y-16, 12, 0, Math.PI*2); ctx.fillStyle=toRGB([255,230,90]); ctx.fill();
        ctx.beginPath(); ctx.arc(this.x+24, this.y-16, 12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(this.x-24, this.y-16, 5, 0, Math.PI*2); ctx.fillStyle=toRGB(BLACK); ctx.fill();
        ctx.beginPath(); ctx.arc(this.x+24, this.y-16, 5, 0, Math.PI*2); ctx.fill();
        
        ctx.beginPath(); ctx.moveTo(this.x-32, this.y+16); ctx.lineTo(this.x+32, this.y+16); ctx.lineTo(this.x, this.y+40); ctx.closePath(); ctx.fill();
    }
}

class BossProjectile {
    constructor(x,y,vx,vy) { this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.radius=18; }
    update() { this.x+=this.vx; this.y+=this.vy; addParticle(this.x, this.y, ACID_GREEN, 1, 4, 1); }
    draw(ctx) {
        blitGlow(ctx, this.x, this.y, this.radius*2, ACID_GREEN, 110);
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle=toRGB(ACID_GREEN); ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle=toRGB([30,110,45]); ctx.stroke();
    }
}

class WeaponDrop {
    constructor(obstacles) {
        this.radius = 24;
        let t = ['sword','bomb','ice','fire','shock'];
        this.type = t[Math.floor(Math.random()*t.length)];
        this.color = {sword:WHITE, bomb:ORANGE, ice:ICE_BLUE, fire:RED, shock:PURPLE}[this.type];
        while(true) {
            this.x = 80 + Math.random()*(WIDTH-160); this.y = 160 + Math.random()*(HEIGHT-240);
            if(!obstacles.some(o => o.collidepoint(this.x, this.y))) break;
        }
    }
    draw(ctx) {
        drawSoftShadow(ctx, this.x, this.y, this.radius);
        blitGlow(ctx, this.x, this.y, this.radius*2, this.color, 90);
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle=toRGB(this.color); ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle=toRGB(BLACK); ctx.stroke();
        let x=this.x, y=this.y;
        ctx.beginPath();
        if(this.type==='sword') { ctx.moveTo(x, y-12); ctx.lineTo(x, y+12); ctx.moveTo(x-8,y+6); ctx.lineTo(x+8,y+6); ctx.lineWidth=4; ctx.stroke(); }
        else if(this.type==='bomb') { ctx.arc(x,y+3,9,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(x,y-6); ctx.lineTo(x+6,y-12); ctx.strokeStyle=toRGB(WHITE); ctx.stroke(); }
        else if(this.type==='ice') { ctx.moveTo(x-9,y-9); ctx.lineTo(x+9,y+9); ctx.moveTo(x-9,y+9); ctx.lineTo(x+9,y-9); ctx.moveTo(x,y-12); ctx.lineTo(x,y+12); ctx.strokeStyle=toRGB(WHITE); ctx.stroke(); }
        else if(this.type==='fire') { ctx.moveTo(x,y-12); ctx.lineTo(x-9,y+9); ctx.lineTo(x+9,y+9); ctx.fillStyle=toRGB(WHITE); ctx.fill(); }
        else if(this.type==='shock') { ctx.moveTo(x+3,y-9); ctx.lineTo(x-6,y+2); ctx.lineTo(x+2,y+2); ctx.lineTo(x-4,y+12); ctx.fillStyle=toRGB(WHITE); ctx.fill(); }
    }
}

class PlayerAttack {
    constructor(t, x, y) { this.type=t; this.x=x; this.y=y; this.timer=t==='bomb'?FPS*1.5:0; this.active=true; }
    update(boss) {
        if(!this.active || !boss) return;
        if(this.type === 'bomb') {
            this.timer--;
            if(this.timer<=0) {
                this.active=false; addParticle(this.x, this.y, ORANGE, 10, 12, 50);
                if(Math.hypot(boss.x-this.x, boss.y-this.y) < 260) boss.hp-=150;
            }
        } else {
            let d = Math.hypot(boss.x-this.x, boss.y-this.y);
            if(d < boss.radius+14) {
                this.active=false;
                if(this.type==='ice') { boss.slow_timer=FPS*4; boss.hp-=20; }
                else if(this.type==='fire') { boss.burn_timer=FPS*5; boss.hp-=10; }
                else if(this.type==='shock') { boss.stun_timer=FPS*2; boss.hp-=30; }
            } else {
                this.x += ((boss.x-this.x)/d)*19; this.y += ((boss.y-this.y)/d)*19;
                let c = this.type==='ice'?ICE_BLUE:(this.type==='fire'?RED:PURPLE);
                addParticle(this.x, this.y, c, 2, 6, 2);
            }
        }
    }
    draw(ctx) {
        if(!this.active) return;
        if(this.type==='bomb') {
            blitGlow(ctx, this.x, this.y, 46, ORANGE, 120);
            ctx.beginPath(); ctx.arc(this.x, this.y, 22+Math.sin(this.timer*0.5)*7, 0, Math.PI*2); ctx.fillStyle=toRGB(ORANGE); ctx.fill();
        } else {
            let c = this.type==='ice'?ICE_BLUE:(this.type==='fire'?RED:PURPLE);
            blitGlow(ctx, this.x, this.y, 34, c, 120);
            ctx.beginPath(); ctx.arc(this.x, this.y, 14, 0, Math.PI*2); ctx.fillStyle=toRGB(c); ctx.fill();
        }
    }
}

class PowerUp {
    constructor(obstacles, mode_idx) {
        this.radius = 20; this.born = Date.now();
        let types = ['speed', 'shield', 'freeze', 'ghost', 'teleport', 'shrink', 'bomb', 'rampage'];
        if(mode_idx === 0) {
            let w = [10, 1, 1, 1, 1, 1, 1, 1, 1]; let sum = 18;
            let r = Math.random() * sum;
            if(r < 10) this.type = 'point';
            else this.type = types[Math.floor(r-10)];
        } else this.type = types[Math.floor(Math.random()*types.length)];
        
        this.color = {point:GOLD, speed:YELLOW, shield:CYAN, freeze:ICE_BLUE, ghost:WHITE, teleport:MAGENTA, shrink:LIME, bomb:ORANGE, rampage:RED}[this.type];
        while(true) {
            this.x = 80 + Math.random()*(WIDTH-160); this.y = 160 + Math.random()*(HEIGHT-240);
            if(!obstacles.some(o => o.collidepoint(this.x, this.y))) break;
        }
    }
    draw(ctx) {
        drawSoftShadow(ctx, this.x, this.y, this.radius);
        let pulse = 1.0 + 0.18 * Math.sin((Date.now() - this.born)*0.006);
        blitGlow(ctx, this.x, this.y, this.radius*2.2*pulse, this.color, 100);
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle=toRGB(this.color); ctx.fill();
        if(this.type === 'point') {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius-4, 0, Math.PI*2); ctx.fillStyle=toRGB(YELLOW); ctx.fill();
            textCenter(ctx, "+1", "bold 26px Arial", toRGB(BLACK), this.x, this.y-13);
        } else {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius/2, 0, Math.PI*2); ctx.fillStyle=toRGB(WHITE); ctx.fill();
        }
        ctx.lineWidth=2; ctx.strokeStyle="rgb(255,255,255)"; ctx.stroke();
    }
}

class BotController {
    constructor(level=1) {
        this.set_level(level);
        this.dir = [0.0, 0.0]; this.timer = 0; this.jitter = [0.0, 0.0];
        this.last_pos = null; this.stuck_timer = 0; this.unstuck_dir = [0.0, 0.0]; this.unstuck_frames = 0;
    }
    set_level(l) { this.cfg = BotController.LEVELS[Math.max(0, Math.min(2, Math.floor(l)))]; }
    
    _norm(vx, vy) {
        let d = Math.hypot(vx, vy);
        if(d < 0.0001) return [0.0, 0.0];
        return [vx/d, vy/d];
    }
    _attract(bot, tx, ty, w) {
        let d = Math.hypot(tx-bot.x, ty-bot.y);
        if(d<1) return [0.0, 0.0];
        return [(tx-bot.x)/d*w, (ty-bot.y)/d*w];
    }
    update(bot, human, mode_idx, catcher_idx, powerups, zombies, boss, boss_projs, weapons, orb_pos) {
        if(!bot.alive || bot.freeze_timer>0) return [0.0, 0.0];
        let c = this.cfg; this.timer--;

        if(this.last_pos) {
            let moved = Math.hypot(bot.x-this.last_pos[0], bot.y-this.last_pos[1]);
            if(moved < 1.5 && (this.dir[0]!==0 || this.dir[1]!==0)) this.stuck_timer++;
            else this.stuck_timer=0;
        }
        this.last_pos = [bot.x, bot.y];
        if(this.stuck_timer > 18 && this.unstuck_frames <= 0) {
            let side = Math.random()>0.5 ? 1 : -1;
            this.unstuck_dir = [-this.dir[1]*side, this.dir[0]*side];
            if(this.unstuck_dir[0]===0 && this.unstuck_dir[1]===0) this.unstuck_dir = [Math.random()>0.5?1:-1, Math.random()>0.5?1:-1];
            this.unstuck_frames = 22; this.stuck_timer = 0;
        }
        if(this.unstuck_frames > 0) { this.unstuck_frames--; return this._norm(...this.unstuck_dir); }

        if(this.timer <= 0) {
            this.timer = c.react;
            this.jitter = [(Math.random()*2-1)*c.err, (Math.random()*2-1)*c.err];
            this.dir = this._decide(bot, human, mode_idx, catcher_idx, powerups, zombies, boss, boss_projs, weapons, orb_pos, c);
        }
        return this.dir;
    }
    _decide(bot, human, mode_idx, catcher_idx, powerups, zombies, boss, boss_projs, weapons, orb_pos, c) {
        let vx=0.0, vy=0.0;
        let m = 130;
        if(bot.x < m) vx += (m-bot.x)/m * 1.3;
        if(bot.x > WIDTH-m) vx -= (bot.x-(WIDTH-m))/m * 1.3;
        if(bot.y < m+60) vy += (m+60-bot.y)/m * 1.3;
        if(bot.y > HEIGHT-m) vy -= (bot.y-(HEIGHT-m))/m * 1.3;

        if(mode_idx === 0) {
            if(catcher_idx === -1 && orb_pos) {
                let a = this._attract(bot, orb_pos[0], orb_pos[1], 1.4); vx+=a[0]; vy+=a[1];
            } else if(catcher_idx === 1) {
                let tx = human.x + this.jitter[0]*300, ty = human.y + this.jitter[1]*300;
                let a = this._attract(bot, tx, ty, 1.8); vx+=a[0]; vy+=a[1];
            } else {
                let d = Math.hypot(human.x-bot.x, human.y-bot.y);
                if(d < c.flee && d > 1) {
                    let w = 1.2 + (1 - d/c.flee)*2.4;
                    vx += (bot.x-human.x)/d*w; vy += (bot.y-human.y)/d*w;
                }
                let best=null, best_d=c.sense;
                for(let p of powerups) {
                    let pd = Math.hypot(p.x-bot.x, p.y-bot.y);
                    if(pd<best_d && Math.hypot(p.x-human.x, p.y-human.y)>200) { best=p; best_d=pd; }
                }
                if(best) { let a = this._attract(bot, best.x, best.y, 1.0); vx+=a[0]; vy+=a[1]; }
            }
        } else {
            for(let z of zombies) {
                let zd = Math.hypot(z.x-bot.x, z.y-bot.y);
                if(zd < c.sense && zd > 1) {
                    let w = (1 - zd/c.sense)*2.6; vx += (bot.x-z.x)/zd*w; vy += (bot.y-z.y)/zd*w;
                }
            }
            if(boss) {
                let bd = Math.hypot(boss.x-bot.x, boss.y-bot.y);
                if(bd < c.flee+160 && bd > 1) {
                    let w = 2.8 * (1 - bd/(c.flee+160)); vx += (bot.x-boss.x)/bd*w; vy += (bot.y-boss.y)/bd*w;
                }
            }
            for(let bp of boss_projs) {
                let rd = Math.hypot(bot.x-bp.x, bot.y-bp.y);
                if(rd < c.dodge && rd > 1) {
                    let vlen = Math.hypot(bp.vx, bp.vy);
                    if(vlen > 0.1) {
                        let closing = (bp.vx*(bot.x-bp.x) + bp.vy*(bot.y-bp.y)) / (vlen*rd);
                        if(closing > 0.5) {
                            let px = -bp.vy/vlen, py = bp.vx/vlen;
                            let sign = (px*(bot.x-bp.x) + py*(bot.y-bp.y)) >= 0 ? 1 : -1;
                            let w = 3.2*(1 - rd/c.dodge); vx += px*sign*w; vy += py*sign*w;
                        }
                    }
                }
            }
            if(Math.hypot(vx,vy) < 0.9) {
                let targets = (boss && weapons.length>0) ? weapons : powerups;
                let best=null, best_d=c.sense;
                for(let t of targets) {
                    let td = Math.hypot(t.x-bot.x, t.y-bot.y);
                    if(td<best_d) { best=t; best_d=td; }
                }
                if(best) { let a = this._attract(bot, best.x, best.y, 1.0); vx+=a[0]; vy+=a[1]; }
            }
        }
        vx += this.jitter[0]*0.5; vy += this.jitter[1]*0.5;
        return this._norm(vx,vy);
    }
}

function empty_highscore() { return {attempts: 0, best_score: null, best_text: "Noch kein Versuch"}; }

function load_highscores() {
    let hs = {}; MODES.forEach(m => hs[m] = empty_highscore());
    try {
        let saved = JSON.parse(HubStorage.getItem("ua_highscores"));
        if(saved) MODES.forEach(m => { if(saved[m] && typeof saved[m] === "object" && Number.isFinite(saved[m].attempts) && (saved[m].best_score === null || Number.isFinite(saved[m].best_score))) hs[m] = saved[m]; });
    } catch(e) {}
    return hs;
}
function save_highscores(hs) { try { HubStorage.setItem("ua_highscores", JSON.stringify(hs)); } catch(e) {} }

function record_highscore(hs, mode_idx, score, text) {
    let mode = MODES[mode_idx];
    let entry = hs[mode];
    entry.attempts++;
    if(entry.best_score === null || score > entry.best_score) {
        entry.best_score = score; entry.best_text = text; save_highscores(hs); return true;
    }
    save_highscores(hs); return false;
}

function drawAnimatedButton(ctx, rect, label, mousePos, animVal, accent=null) {
    let hover = rect.collidepoint(mousePos.x, mousePos.y);
    animVal += ((hover ? 1 : 0) - animVal) * 0.18;
    let inf = Math.floor(animVal * 8);
    let aRect = rect.inflate(inf, inf);

    let bc = [52,54,72], hc = [96,100,138];
    if(label === "Beenden" || label === "Spiel Beenden" || label === "Zurück zum Hub") { bc = [110,40,44]; hc = [175,60,64]; }
    if(accent === "start") { bc = [20,110,110]; hc = [0,170,170]; }
    
    let c = [ bc[0]+(hc[0]-bc[0])*animVal, bc[1]+(hc[1]-bc[1])*animVal, bc[2]+(hc[2]-bc[2])*animVal ];

    if(hover) {
        let gc = accent==="start" ? CYAN : [200,205,255];
        ctx.fillStyle = toRGB(gc, 45*animVal/255);
        roundRect(ctx, aRect.x-20, aRect.y-20, aRect.w+40, aRect.h+40, 18); ctx.fill();
    }

    ctx.fillStyle = toRGB(c); roundRect(ctx, aRect.x, aRect.y, aRect.w, aRect.h, 10); ctx.fill();
    ctx.fillStyle = toRGB([Math.min(255, c[0]+28), Math.min(255, c[1]+28), Math.min(255, c[2]+30)]);
    roundRect(ctx, aRect.x+3, aRect.y+3, aRect.w-6, Math.max(5, aRect.h/4), 8); ctx.fill();
    
    ctx.lineWidth = 2; ctx.strokeStyle = toRGB(WHITE); roundRect(ctx, aRect.x, aRect.y, aRect.w, aRect.h, 10); ctx.stroke();
    
    let fontStr = accent==="start" ? "bold 34px Arial" : "26px Arial";
    let yOff = accent==="start" ? 17 : 13;
    textCenter(ctx, label, fontStr, toRGB(WHITE), aRect.centerx, aRect.centery - yOff);
    return animVal;
}

function drawArrowButton(ctx, rect, dir, mousePos) {
    let hover = rect.collidepoint(mousePos.x, mousePos.y);
    if(hover) {
        ctx.fillStyle = "rgba(200,205,255,0.18)"; roundRect(ctx, rect.x-12, rect.y-12, rect.w+24, rect.h+24, 14); ctx.fill();
    }
    ctx.fillStyle = hover ? "rgb(100,104,140)" : "rgb(54,56,74)";
    roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 12); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=toRGB(WHITE); ctx.stroke();
    
    let cx = rect.centerx, cy = rect.centery, s = Math.floor(rect.w/4);

    if(dir==="left") { ctx.moveTo(cx-s, cy); ctx.lineTo(cx+s, cy-s); ctx.lineTo(cx+s, cy+s); }
    else { ctx.moveTo(cx+s, cy); ctx.lineTo(cx-s, cy-s); ctx.lineTo(cx-s, cy+s); }
    ctx.fillStyle = toRGB(WHITE); ctx.fill();
}

function pollGamepads() {
    let gps = (navigator.getGamepads && typeof navigator.getGamepads === 'function') ? navigator.getGamepads() : [];
    for(let i=0; i<gps.length; i++) {
        let gp = gps[i]; if(!gp) continue;
        if(!lastBtnState[i]) lastBtnState[i] = [];
        if(!lastHatState[i]) lastHatState[i] = [0,0];

        let b = gp.buttons;
        let justPressed = (idx) => b[idx] && b[idx].pressed && !lastBtnState[i][idx];

        if (state === "HUB") {
            if (justPressed(0) || justPressed(7)) state = "MENU"; // A or Start geht in die Arena
        } else if(state === "MENU") {
            if(i===0) {
                if(justPressed(0) || justPressed(7)) clickTriggered = true;
                if(justPressed(1)) state = "HUB"; // Taste B = Zurück zum Hub
                if(justPressed(3)) { scroll_y=0; state="ACHIEVEMENTS"; }
                if(justPressed(2)) state="HIGHSCORES";
                if(justPressed(6)) state="TUTORIAL";
                if(justPressed(5)) mode_idx = (mode_idx+1)%MODES.length;
                if(justPressed(4)) map_idx = (map_idx+1)%MAPS.length;
                if(justPressed(8) || justPressed(9)) boss_enabled = !boss_enabled;
            }
            
            let ax = Math.abs(gp.axes[0]) > 0.5 ? Math.sign(gp.axes[0]) : 0;
            let ay = Math.abs(gp.axes[1]) > 0.5 ? Math.sign(gp.axes[1]) : 0;
            
            if(ax !== lastHatState[i][0] || ay !== lastHatState[i][1]) {
                if(i===0) {
                    if(ax === -1) p1_skin_idx = (p1_skin_idx-1+SKINS.length)%SKINS.length;
                    if(ax === 1) p1_skin_idx = (p1_skin_idx+1)%SKINS.length;
                    if(ay === 1) p1_color_idx = (p1_color_idx-1+COLORS.length)%COLORS.length;
                    if(ay === -1) p1_color_idx = (p1_color_idx+1)%COLORS.length;
                } else if(i===1 && ![1,3].includes(mode_idx)) {
                    if(ax === -1) p2_skin_idx = (p2_skin_idx-1+SKINS.length)%SKINS.length;
                    if(ax === 1) p2_skin_idx = (p2_skin_idx+1)%SKINS.length;
                    if(ay === 1) p2_color_idx = (p2_color_idx-1+COLORS.length)%COLORS.length;
                    if(ay === -1) p2_color_idx = (p2_color_idx+1)%COLORS.length;
                }
            }
            lastHatState[i] = [ax, ay];
        } else if(["HIGHSCORES","TUTORIAL","ACHIEVEMENTS","CREDITS","SETTINGS"].includes(state)) {
            if(justPressed(0) || justPressed(1)) state="MENU";
            if(state === "ACHIEVEMENTS" && i===0 && Math.abs(gp.axes[1]) > 0.2) scroll_y -= gp.axes[1]*18;
        } else if(state === "LEGAL") {
            if(justPressed(0) || justPressed(1)) state="HUB";
            if(i===0 && Math.abs(gp.axes[1]) > 0.2) scroll_y -= gp.axes[1]*18;
        } else if (state === "PLAYING") {
            if(justPressed(7)) { state="PAUSED"; pause_start_tick = Date.now(); }
        } else if (state === "PAUSED") {
            if(justPressed(0) || justPressed(7)) { state="PLAYING"; paused_time_total += Date.now() - pause_start_tick; }
            if(justPressed(1)) state="MENU";
        } else if (state === "GAME_OVER") {
            if(justPressed(0) || justPressed(7)) state="MENU";
        }

        for(let j=0; j<b.length; j++) lastBtnState[i][j] = b[j].pressed;
    }
}

        else if(btns.p1sR.collidepoint(lc.x, lc.y)) p1_skin_idx = (p1_skin_idx+1)%SKINS.length;
        else if(btns.p1cL.collidepoint(lc.x, lc.y)) p1_color_idx = (p1_color_idx-1+COLORS.length)%COLORS.length;
        else if(btns.p1cR.collidepoint(lc.x, lc.y)) p1_color_idx = (p1_color_idx+1)%COLORS.length;
        else if(mode_idx !== 1 && mode_idx !== 3) {
            if(btns.p2type.collidepoint(lc.x, lc.y)) { p2_is_bot=!p2_is_bot; stats.p2_bot=p2_is_bot; save_stats(stats); }
            else if(btns.p2sL.collidepoint(lc.x, lc.y)) p2_skin_idx = (p2_skin_idx-1+SKINS.length)%SKINS.length;
            else if(btns.p2sR.collidepoint(lc.x, lc.y)) p2_skin_idx = (p2_skin_idx+1)%SKINS.length;
            else if(btns.p2cL.collidepoint(lc.x, lc.y)) p2_color_idx = (p2_color_idx-1+COLORS.length)%COLORS.length;
            else if(btns.p2cR.collidepoint(lc.x, lc.y)) p2_color_idx = (p2_color_idx+1)%COLORS.length;
        }
    } else if(["HIGHSCORES","TUTORIAL","ACHIEVEMENTS","CREDITS","SETTINGS"].includes(state) && btns.back.collidepoint(lc.x,lc.y)) {
        state = "MENU";
    } else if(state === "SETTINGS") {
        if(btns.fps.collidepoint(lc.x,lc.y)) { stats.show_fps = !stats.show_fps; save_stats(stats); }
        else if(btns.touch.collidepoint(lc.x,lc.y)) { stats.touch_ctrl = !stats.touch_ctrl; save_stats(stats); }
        else if(btns.mouse.collidepoint(lc.x,lc.y)) { stats.mouse_ctrl = !stats.mouse_ctrl; save_stats(stats); }
        else if(btns.bot.collidepoint(lc.x,lc.y)) { bot_level = (bot_level+1)%3; stats.bot_level=bot_level; save_stats(stats); }
    } else if(state === "PAUSED") {
        if(btns.resume.collidepoint(lc.x,lc.y)) { state="PLAYING"; paused_time_total += Date.now() - pause_start_tick; }
        else if(btns.mPause.collidepoint(lc.x,lc.y)) state="MENU";
    } else if(state === "GAME_OVER") {
        state = "MENU";
    }
    return false;
}

function startGame() {
    if(onlineArenaBridge?.active) {
        mode_idx = onlineArenaBridge.modeIndex;
        p2_is_bot = false;
    }
    current_mode_idx = mode_idx; highscore_notice = ""; state = "PLAYING";
    boss_active = false; boss_defeated = false;
    stats.games_played = (stats.games_played||0)+1;
    if(mode_idx===2 || mode_idx===4) stats.coop_played = (stats.coop_played||0)+1;
    save_stats(stats);

    let p1c = {up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD'};
    let p2c = {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'};
    let bot_round = p2_is_bot && [0,2,4].includes(mode_idx);

    player1 = new Player(260, HEIGHT/2, COLORS[p1_color_idx][1], p1c, "P1", SKINS[p1_skin_idx], 0);
    player2 = new Player(WIDTH-260, HEIGHT/2, COLORS[p2_color_idx][1], p2c, "P2", SKINS[p2_skin_idx], bot_round?null:1, bot_round);
    
    if(bot_round) { player2.bot_speed_factor = BotController.LEVELS[bot_level].speed; bot_ctrl = new BotController(bot_level); }
    else bot_ctrl = null;

    if(mode_idx===1 || mode_idx===3) { player2.alive=false; player2.revive_timer=-1; }

    obstacles = MAPS[map_idx].walls.slice();
    powerups=[]; zombies=[]; particles=[]; weapons=[]; attacks=[]; boss_projs=[]; boss=null;
    catcher_idx = mode_idx===0 ? -1 : -2; tag_cooldown=0;
    paused_time_total=0; survived_time=0; time_left=GAME_TIME; start_ticks=Date.now();
    vjoys = {fid1:null, fid2:null, p1:null, p2:null, base1:[0,0], base2:[0,0]};
}

function serializeOnlineArena() {
    const copy = value => Array.isArray(value) ? value.slice() : value;
    const player = p => p ? ({x:p.x,y:p.y,alive:!!p.alive,score:p.score||0,base_color:copy(p.base_color),skin:p.skin,radius:p.radius,has_shield:!!p.has_shield,speed_timer:p.speed_timer||0,freeze_timer:p.freeze_timer||0,ghost_timer:p.ghost_timer||0,shrink_timer:p.shrink_timer||0,rampage_timer:p.rampage_timer||0,revive_timer:p.revive_timer||0}) : null;
    const item = p => p ? ({x:p.x,y:p.y,type:p.type,color:copy(p.color),radius:p.radius,phase:0,born:p.born||0}) : null;
    const object = p => p ? ({x:p.x,y:p.y,vx:p.vx,vy:p.vy,radius:p.radius,type:p.type,active:p.active,timer:p.timer}) : null;
    let winner = null, result = null;
    if(state==='GAME_OVER') {
        if(mode_idx===0) { winner = player1.score===player2.score ? null : (player1.score>player2.score ? 0 : 1); result = winner===null ? 'draw' : 'won'; }
        else if(boss_defeated) { result='won'; winner=0; }
        else if(!player1.alive&&!player2.alive) result='lost';
    }
    return {w:WIDTH,h:HEIGHT,mode:mode_idx,modeIndex:mode_idx,mapIndex:map_idx,players:[player(player1),player(player2)].filter(Boolean),scores:[player1?.score||0,player2?.score||0],elapsed:survived_time,catcher:catcher_idx,orb:{x:WIDTH/2,y:HEIGHT/2},powerups:powerups.map(item),weapons:weapons.map(item),projectiles:boss_projs.map(object),attacks:attacks.map(object),boss:boss?{x:boss.x,y:boss.y,hp:boss.hp,maxHp:boss.max_hp,radius:boss.radius,state:boss.state,state_timer:boss.state_timer,burn_timer:boss.burn_timer,slow_timer:boss.slow_timer,stun_timer:boss.stun_timer}:null,zombies:zombies.map(z=>({x:z.x,y:z.y,radius:z.radius,freeze_timer:z.freeze_timer})),winner,result,state};
}

function update() {
    let now = Date.now();

    // A guest still uses this original update/draw loop. Its bridge replaces
    // the local objects from the host snapshot, so no second online physics
    // implementation is needed.
    if(onlineArenaBridge?.active && onlineArenaBridge.remoteOnly) return;
    
    if(state === "PLAYING") {
        survived_time = Math.floor((now - start_ticks - paused_time_total)/1000);
        time_left = Math.max(0, GAME_TIME - survived_time);
        stats.max_survived = Math.max(stats.max_survived||0, survived_time);
        boss_spawn_time = [3,4].includes(mode_idx) ? 0 : (BOSS_TEST_MODUS ? 3 : 120);

        timer_spawns++;
        if(timer_spawns >= FPS*4) {
            timer_spawns = 0;
            if(boss_active) { if(weapons.length<4) weapons.push(new WeaponDrop(obstacles)); }
            else { if(catcher_idx !== -1 && powerups.length<4) powerups.push(new PowerUp(obstacles, mode_idx)); }
        }

        if([1,2].includes(mode_idx) && !boss_active && !boss_defeated && !BOSS_TEST_MODUS) {
            let spawn_rate = Math.max(100, 240 - (survived_time*2));
            if(timer_spawns % spawn_rate === 0) {
                let edges = ['top','bottom','left','right'], edge = edges[Math.floor(Math.random()*4)];
                let zx = ['top','bottom'].includes(edge) ? Math.random()*WIDTH : (edge==='left' ? -30 : WIDTH+30);
                let zy = ['left','right'].includes(edge) ? Math.random()*HEIGHT : (edge==='top' ? -30 : HEIGHT+30);
                zombies.push(new Zombie(zx, zy));
            }
        }

        let can_spawn_boss = [3,4].includes(mode_idx) || (boss_enabled && [1,2].includes(mode_idx));
        if(can_spawn_boss && survived_time >= boss_spawn_time && !boss_active && !boss_defeated) {
            boss_active=true; zombies=[]; powerups=[]; boss=new Boss(WIDTH/2, -80); screen_shake=30;
        }

        [player1, player2].forEach(p => {
            if(!p.alive && p.revive_timer === 1) {
                stats.revives = (stats.revives||0)+1; p.alive=true; p.has_shield=true; p.ghost_timer=FPS*2;
            }
        });

        let vj1_dir=[0,0], vj2_dir=[0,0];
        if(onlineArenaBridge?.active) {
            vj1_dir = onlineArenaBridge.directions(0);
            vj2_dir = onlineArenaBridge.directions(1);
        } else if(stats.touch_ctrl) {
            if(vjoys.p1) {
                let vx = vjoys.p1[0]-vjoys.base1[0], vy = vjoys.p1[1]-vjoys.base1[1];
                let dist = Math.hypot(vx,vy);
                if(dist>0) vj1_dir = [(vx/dist)*Math.min(dist/90, 1), (vy/dist)*Math.min(dist/90, 1)];
            }
            if(vjoys.p2 && !player2.is_bot) {
                let vx = vjoys.p2[0]-vjoys.base2[0], vy = vjoys.p2[1]-vjoys.base2[1];
                let dist = Math.hypot(vx,vy);
                if(dist>0) vj2_dir = [(vx/dist)*Math.min(dist/90, 1), (vy/dist)*Math.min(dist/90, 1)];
            }
        }

        let m_target = (stats.mouse_ctrl && mouseButtons.left) ? mousePos : null;
        
        let bot_dir = [0,0];
        if(player2.is_bot && bot_ctrl) {
            let orb = (mode_idx===0 && catcher_idx===-1) ? [WIDTH/2, HEIGHT/2] : null;
            bot_dir = bot_ctrl.update(player2, player1, mode_idx, catcher_idx, powerups, zombies, boss_active?boss:null, boss_projs, weapons, orb);
        }

        player1.move(obstacles, (mode_idx===0 && catcher_idx===0), vj1_dir, m_target);
        player2.move(obstacles, (mode_idx===0 && catcher_idx===1), player2.is_bot?bot_dir:vj2_dir);

        if(!boss_active) zombies.forEach(z => z.move_towards(player1, player2, obstacles));

        if(boss_active && boss) {
            boss.update(player1, player2, boss_projs);
            if(boss.hp <= 0) {
                boss_defeated=true; boss_active=false; boss=null; state="GAME_OVER";
                stats.bosses_killed = (stats.bosses_killed||0)+1; save_stats(stats);
                winner_text="BOSS BESIEGT! IHR GEWINNT!"; winner_color=YELLOW;
                if(record_highscore(highscores, current_mode_idx, 100000-survived_time, `Boss besiegt nach ${survived_time}s`)) highscore_notice="NEUER HIGHSCORE!";
            }
            for(let i=boss_projs.length-1; i>=0; i--) {
                let bp = boss_projs[i]; bp.update();
                if(bp.x<0||bp.x>WIDTH||bp.y<0||bp.y>HEIGHT || obstacles.some(o => new Rect(bp.x-bp.radius, bp.y-bp.radius, bp.radius*2, bp.radius*2).collidepoint(o.left, o.top))) {
                    if(bp.x>0&&bp.x<WIDTH&&bp.y>0&&bp.y<HEIGHT) addParticle(bp.x, bp.y, ACID_GREEN, 2, 5, 15);
                    boss_projs.splice(i,1); continue;
                }
                for(let p of [player1, player2]) {
                    if(p.alive && p.ghost_timer===0 && Math.hypot(p.x-bp.x, p.y-bp.y) < p.radius+bp.radius) {
                        if(p.has_shield) { p.has_shield=false; boss_projs.splice(i,1); break; }
                        else { p.alive=false; p.revive_timer=FPS*15; break; }
                    }
                }
            }
        }

        for(let i=attacks.length-1; i>=0; i--) { attacks[i].update(boss); if(!attacks[i].active) attacks.splice(i,1); }
        if(tag_cooldown>0) tag_cooldown--;
        if(screen_shake>0) screen_shake--;

        if(mode_idx===0 && catcher_idx===-1) {
            let p = Math.sin(now*0.005)*8;
            let orb = start_orb_rect.inflate(p,p);
            if(orb.collidepoint(player1.x, player1.y)) { catcher_idx=1; tag_cooldown=FPS*1.5; screen_shake=10; addParticle(player1.x, player1.y, PURPLE, 6,10,30); }
            else if(orb.collidepoint(player2.x, player2.y)) { catcher_idx=0; tag_cooldown=FPS*1.5; screen_shake=10; addParticle(player2.x, player2.y, PURPLE, 6,10,30); }
        }

        for(let i=powerups.length-1; i>=0; i--) {
            let pu = powerups[i], c=null;
            if(player1.alive && Math.hypot(player1.x-pu.x, player1.y-pu.y)<player1.radius+pu.radius) c=player1;
            else if(player2.alive && Math.hypot(player2.x-pu.x, player2.y-pu.y)<player2.radius+pu.radius) c=player2;

            if(c) {
                if(pu.type === 'point') {
                    if((c===player1 && catcher_idx===0) || (c===player2 && catcher_idx===1)) continue;
                    c.score++; addParticle(pu.x,pu.y,GOLD,6,10,30); powerups.splice(i,1); continue;
                }
                stats.powerups = (stats.powerups||0)+1;
                if(pu.type==='speed') stats.speed_pu=(stats.speed_pu||0)+1;
                if(pu.type==='shield') stats.shield_pu=(stats.shield_pu||0)+1;
                if(pu.type==='ghost') stats.ghost_pu=(stats.ghost_pu||0)+1;
                if(pu.type==='freeze') stats.freeze_pu=(stats.freeze_pu||0)+1;
                if(pu.type==='shrink') stats.shrink_pu=(stats.shrink_pu||0)+1;

                addParticle(pu.x,pu.y,pu.color,5,8,20);
                if(pu.type==='speed') c.speed_timer=FPS*5;
                else if(pu.type==='shield') c.has_shield=true;
                else if(pu.type==='ghost') c.ghost_timer=FPS*5;
                else if(pu.type==='shrink') c.shrink_timer=FPS*8;
                else if(pu.type==='teleport') { c.x = 80+Math.random()*(WIDTH-160); c.y = 160+Math.random()*(HEIGHT-240); }
                else if(pu.type==='rampage') c.rampage_timer=FPS*6;
                else if(pu.type==='bomb') { screen_shake=20; if(mode_idx===0) (c===player1?player2:player1).freeze_timer=FPS*4; else { zombies.forEach(z=>addParticle(z.x,z.y,ZOMBIE_GREEN,6,6,10)); zombies=[]; } }
                else if(pu.type==='freeze') { if(mode_idx===0) (c===player1?player2:player1).freeze_timer=FPS*2; else zombies.forEach(z=>z.freeze_timer=FPS*3); }
                powerups.splice(i,1);
            }
        }

        for(let i=weapons.length-1; i>=0; i--) {
            let w = weapons[i], c=null;
            if(player1.alive && Math.hypot(player1.x-w.x, player1.y-w.y)<player1.radius+w.radius) c=player1;
            else if(player2.alive && Math.hypot(player2.x-w.x, player2.y-w.y)<player2.radius+w.radius) c=player2;
            if(c) {
                stats.weapons = (stats.weapons||0)+1; addParticle(w.x, w.y, w.color, 6,10,20);
                if(w.type==='sword') { if(boss) { boss.hp-=100; addParticle(boss.x, boss.y, WHITE, 10,6,30); } }
                else attacks.push(new PlayerAttack(w.type, c.x, c.y));
                weapons.splice(i,1);
            }
        }

        if(mode_idx===0 && catcher_idx>=0 && tag_cooldown===0) {
            if(Math.hypot(player1.x-player2.x, player1.y-player2.y) < player1.radius+player2.radius) {
                stats.catches = (stats.catches||0)+1; screen_shake=15;
                addParticle(player1.x+(player2.x-player1.x)/2, player1.y+(player2.y-player1.y)/2, RED, 10,8,40);
                if(catcher_idx===0) { if(player2.has_shield){player2.has_shield=false; tag_cooldown=FPS*1.5;} else {catcher_idx=1; player2.times_caught++; tag_cooldown=FPS*2;} }
                else { if(player1.has_shield){player1.has_shield=false; tag_cooldown=FPS*1.5;} else {catcher_idx=0; player1.times_caught++; tag_cooldown=FPS*2;} }
            }
        }

        if(!boss_active) {
            for(let i=zombies.length-1; i>=0; i--) {
                let z = zombies[i], killed=false;
                for(let p of [player1, player2]) {
                    if(p.alive && p.ghost_timer===0 && Math.hypot(p.x-z.x, p.y-z.y) < p.radius+z.radius) {
                        if(p.rampage_timer>0) { screen_shake=5; addParticle(z.x,z.y,ZOMBIE_GREEN,7,10,20); killed=true; break; }
                        else if(p.has_shield) { p.has_shield=false; killed=true; break; }
                        else { p.alive=false; p.revive_timer=FPS*15; break; }
                    }
                }
                if(killed) zombies.splice(i,1);
            }
        } else if(boss) {
            [player1, player2].forEach(p => {
                if(p.alive && p.ghost_timer===0 && Math.hypot(p.x-boss.x, p.y-boss.y) < p.radius+boss.radius) { p.alive=false; p.revive_timer=FPS*15; }
            });
        }

        if(mode_idx===0 && time_left<=0) {
            state="GAME_OVER";
            let p2name = player2.is_bot ? "Computer" : "Spieler 2";
            if(player1.score > player2.score) { winner_text="Spieler 1 gewinnt!"; winner_color=player1.base_color; if(player2.is_bot) stats.bot_wins=(stats.bot_wins||0)+1; }
            else if(player2.score > player1.score) { winner_text=`${p2name} gewinnt!`; winner_color=player2.base_color; }
            else { winner_text="Unentschieden!"; winner_color=WHITE; }
            save_stats(stats);
            let best = Math.max(player1.score, player2.score);
            if(record_highscore(highscores, current_mode_idx, best, `Punkte-Runde: ${best} gesammelt`)) highscore_notice="NEUER HIGHSCORE!";
        } else if(mode_idx!==0 && !player1.alive && !player2.alive) {
            state="GAME_OVER"; winner_text=`Gestorben nach: ${survived_time}s`; winner_color=RED; save_stats(stats);
            if(record_highscore(highscores, current_mode_idx, survived_time, `Überlebt ${survived_time}s`)) highscore_notice="NEUER HIGHSCORE!";
        }
        if(onlineArenaBridge?.active && onlineArenaBridge.onSnapshot) onlineArenaBridge.onSnapshot(serializeOnlineArena());
    }
}

function draw() {
    ctx.clearRect(0,0,WIDTH,HEIGHT);
    let shx = screen_shake>0 ? (Math.random()*14-7) : 0;
    let shy = screen_shake>0 ? (Math.random()*14-7) : 0;
    ctx.save(); ctx.translate(shx, shy);

    ctx.drawImage(BACKGROUND, 0, 0);

    if(["PLAYING","PAUSED","GAME_OVER"].includes(state)) {
        obstacles.forEach(o => drawWall(ctx, o));
        
        if(mode_idx===0 && catcher_idx===-1) {
            let p = Math.sin(Date.now()*0.005)*8;
            let orb = start_orb_rect.inflate(p,p);
            blitGlow(ctx, cx, HEIGHT/2, 95, PURPLE, 110);
            ctx.beginPath(); ctx.ellipse(orb.centerx, orb.centery, orb.w/2, orb.h/2, 0, 0, Math.PI*2); ctx.fillStyle=toRGB(PURPLE); ctx.fill();
            ctx.lineWidth=3; ctx.strokeStyle=toRGB(WHITE); ctx.stroke();
        }

        powerups.forEach(p => p.draw(ctx)); weapons.forEach(w => w.draw(ctx)); zombies.forEach(z => z.draw(ctx));
        boss_projs.forEach(bp => bp.draw(ctx)); attacks.forEach(a => a.draw(ctx));
        if(boss) boss.draw(ctx);

        let p1_stat = catcher_idx===-1 ? -1 : (mode_idx===0 ? (catcher_idx===0?0:1) : 1);
        let p2_stat = catcher_idx===-1 ? -1 : (mode_idx===0 ? (catcher_idx===1?0:1) : 1);
        player1.draw(ctx, p1_stat); player2.draw(ctx, p2_stat);

        // --- DYNAMISCHE VIRTUAL JOYSTICKS ---
        if(stats.touch_ctrl && state==="PLAYING") {
            ctx.lineWidth=3; ctx.strokeStyle="rgba(255,255,255,0.25)";
            if(vjoys.p1) {
                ctx.beginPath(); ctx.arc(vjoys.base1[0], vjoys.base1[1], 90, 0, Math.PI*2); ctx.stroke();
                let vx = vjoys.p1[0]-vjoys.base1[0], vy = vjoys.p1[1]-vjoys.base1[1];
                let dist = Math.min(Math.hypot(vx,vy), 90), ang = Math.atan2(vy,vx);
                ctx.beginPath(); ctx.arc(vjoys.base1[0]+Math.cos(ang)*dist, vjoys.base1[1]+Math.sin(ang)*dist, 34, 0, Math.PI*2); 
                ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fill();
            }
            if(![1,3].includes(mode_idx) && !player2.is_bot && vjoys.p2) {
                ctx.beginPath(); ctx.arc(vjoys.base2[0], vjoys.base2[1], 90, 0, Math.PI*2); ctx.stroke();
                let vx = vjoys.p2[0]-vjoys.base2[0], vy = vjoys.p2[1]-vjoys.base2[1];
                let dist = Math.min(Math.hypot(vx,vy), 90), ang = Math.atan2(vy,vx);
                ctx.beginPath(); ctx.arc(vjoys.base2[0]+Math.cos(ang)*dist, vjoys.base2[1]+Math.sin(ang)*dist, 34, 0, Math.PI*2); 
                ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fill();
            }
        }
    }

    drawParticles(ctx);
    if(state !== "PLAYING" && state !== "PAUSED" && state !== "GAME_OVER") ctx.drawImage(VIGNETTE, 0, 0);

    // --- HUD ---
    if(["PLAYING","PAUSED","GAME_OVER"].includes(state)) {
        let p2name = player2.is_bot ? "CPU" : "P2";
        if(mode_idx===0) {
            drawPanel(ctx, new Rect(28,20,400,64), 170, 12); drawText(ctx, `P1 Punkte: ${player1.score}`, "bold 34px Arial", toRGB(player1.base_color), 56, 32);
            drawPanel(ctx, new Rect(WIDTH-548,20,400,64), 170, 12);
            ctx.font="bold 34px Arial"; let tw = ctx.measureText(`${p2name} Punkte: ${player2.score}`).width;
            drawText(ctx, `${p2name} Punkte: ${player2.score}`, "bold 34px Arial", toRGB(player2.base_color), WIDTH-176-tw, 32);
            
            drawPanel(ctx, new Rect(cx-170, 20, 340, 64), 170, 12);
            let sec = time_left%60; textCenter(ctx, `Zeit: ${Math.floor(time_left/60)}:${sec<10?'0'+sec:sec}`, "bold 34px Arial", time_left<=30?toRGB(RED):toRGB(WHITE), cx, 32);

            let stat = catcher_idx===-1 ? "Berühre die LILA Kugel in der Mitte!" : (catcher_idx===0 ? `P1 [ROT] jagt!  ${p2name} muss Punkte sammeln!` : `${p2name} [ROT] jagt!  P1 muss Punkte sammeln!`);
            drawPanel(ctx, new Rect(cx-430,94,860,46), 140, 12); textCenter(ctx, stat, "bold 34px Arial", catcher_idx===-1?toRGB(PURPLE):toRGB(RED), cx, 98);

// The host runs the original update(); a guest only applies the host snapshot

    const map = {'arena-catch':0,'arena-zombie':2,'arena-boss':4};
    return Number.isInteger(options.modeIndex) ? options.modeIndex : (map[options.mode] ?? 0);
}
function restoreOnlinePlayer(data, index) {
    const color = Array.isArray(data?.base_color) ? data.base_color : COLORS[index ? 1 : 0][1];
    const skin = typeof data?.skin === 'string' ? data.skin : SKINS[index ? 1 : 0];
    const player = new Player(Number(data?.x)||0, Number(data?.y)||0, color, {}, index ? 'P2' : 'P1', skin, index);

    if(!player1 || !player2 || mode_idx !== mode) { mode_idx = mode; p2_is_bot = false; startGame(); }
    map_idx = Number.isInteger(snapshot.mapIndex) && MAPS[snapshot.mapIndex] ? snapshot.mapIndex : 0;
    obstacles = MAPS[map_idx].walls.slice();
    player1 = restoreOnlinePlayer(snapshot.players[0], 0);
    player2 = restoreOnlinePlayer(snapshot.players[1], 1);
    powerups = (snapshot.powerups || []).map(item => Object.assign(new PowerUp(obstacles, mode_idx), item));
    weapons = (snapshot.weapons || []).map(item => Object.assign(new WeaponDrop(obstacles), item));
    zombies = (snapshot.zombies || []).map(item => Object.assign(new Zombie(Number(item.x)||0, Number(item.y)||0), item));
    boss_projs = (snapshot.projectiles || []).map(item => Object.assign(new BossProjectile(Number(item.x)||0, Number(item.y)||0, Number(item.vx)||0, Number(item.vy)||0), item));
    attacks = (snapshot.attacks || []).map(item => Object.assign(new PlayerAttack(item.type, Number(item.x)||0, Number(item.y)||0), item));
    boss = snapshot.boss ? Object.assign(new Boss(Number(snapshot.boss.x)||0, Number(snapshot.boss.y)||0), {...snapshot.boss, max_hp:Number(snapshot.boss.maxHp ?? snapshot.boss.max_hp)||undefined}) : null;
    boss_active = !!boss; boss_defeated = !boss && mode_idx !== 0 && snapshot.result === 'won';
    catcher_idx = Number.isInteger(snapshot.catcher) ? snapshot.catcher : -1;

    if(snapshot.state === 'GAME_OVER') { state = 'GAME_OVER'; winner_text = snapshot.result === 'won' ? 'IHR GEWINNT!' : snapshot.result === 'draw' ? 'Unentschieden!' : 'Runde beendet'; winner_color = snapshot.result === 'won' ? YELLOW : snapshot.result === 'draw' ? WHITE : RED; }
    else if(snapshot.state === 'PAUSED') state = 'PAUSED';

function makeOnlineBridge(options={}, remoteOnly=false) {

    bridge.pause=()=>{if(bridge.active&&state==='PLAYING'){state='PAUSED';pause_start_tick=Date.now();}};
    bridge.resume=()=>{if(bridge.active&&state==='PAUSED'){state='PLAYING';paused_time_total+=Date.now()-pause_start_tick;}};
    bridge.stop=()=>{bridge.active=false;if(onlineArenaBridge===bridge)onlineArenaBridge=null;if(['ONLINE','PLAYING','PAUSED','GAME_OVER'].includes(state))state='HUB';};
    bridge.snapshot=()=>serializeOnlineArena();
    return bridge;
}
window.UltimateArenaOriginal.createOnlineBridge = options => makeOnlineBridge(options, false);
window.UltimateArenaOriginal.attachOnlineBridge = options => makeOnlineBridge(options, true);

let lastTime = performance.now();
let deltaAccumulator = 0;

function gameLoop(now) {
    let delta = now - lastTime;
    lastTime = now;
    
    if(delta > 250) delta = 250; // Verhindert Spiel-Abstürze beim Tab-Wechseln
    deltaAccumulator += delta;

    pollGamepads();

    while(deltaAccumulator >= TIME_STEP) {
        if(processUI()) startGame();
        update();
        deltaAccumulator -= TIME_STEP;
    }
    
    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

        cache.set(source, result);
        return result;

    const foot=el('footer',undefined,inner,'device-footer');for(const [label,page] of [['Credits & Info','CREDITS'],['Erfolge','ACHIEVEMENTS'],['Datenschutz & Impressum','LEGAL']])button(tr(label),()=>HubActions.info(page,'HUB'),foot);
    button(({de:'Hub teilen · QR',en:'Share hub · QR',fr:'Partager le hub · QR',es:'Compartir hub · QR'})[HubI18n.language],()=>HubActions.info('CREDITS','HUB'),foot);
    button(t(HubStorage.enabled?17:15),()=>HubActions.info('SETTINGS','HUB'),foot);button(tr('Beenden'),()=>HubActions.quit(),foot);
    el('p',t(1)+' · '+t(HubStorage.enabled?17:16),inner,'device-meta');
  }
  function drawPreviews(){const now=performance.now();if(now-lastPreview<67)return;lastPreview=now;const motion=HubFeedback.getSettings().motion&&!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches,time=motion?performance.now()/1000:0;
    previews.forEach(({canvas:cv,kind})=>{const c=cv.getContext('2d');if(['prism','cloud'].includes(kind)){BonusGames.preview(c,kind,600,230,time);}else if(['rally','orbit'].includes(kind)){
      c.fillStyle=kind==='rally'?'#0c2634':'#1d223c';c.fillRect(0,0,600,230);c.fillStyle='#aac9e4';for(let i=0;i<22;i++)c.fillRect((i*113)%600,(i*67+time*8)%230,2,2);
      if(kind==='rally'){c.strokeStyle='#355c6b';c.setLineDash([8,10]);c.beginPath();c.moveTo(20,115);c.lineTo(580,115);c.stroke();c.setLineDash([]);for(const [i,color] of ['#64eadf','#e3a5ff'].entries()){c.fillStyle=color;c.beginPath();c.roundRect(225+Math.sin(time+i)*85,i?22:195,150,12,6);c.fill();}c.fillStyle='#fff4ce';c.beginPath();c.arc(300+Math.cos(time*1.4)*165,115+Math.sin(time*1.7)*50,10,0,7);c.fill();}
      else{for(let i=0;i<3;i++){c.fillStyle=i%2?'#ffd16d':'#a582a4';c.beginPath();c.arc(130+i*180,40+(i*45+time*20)%110,i%2?8:18,0,7);c.fill();}const x=300+Math.sin(time)*70;c.fillStyle='#a5e9ff';c.beginPath();c.moveTo(x,127);c.lineTo(x+22,180);c.lineTo(x,166);c.lineTo(x-22,180);c.closePath();c.fill();c.fillStyle='#ffb46d';c.beginPath();c.moveTo(x-8,176);c.lineTo(x,202);c.lineTo(x+8,176);c.fill();}
      }else HubPresentation.preview(c,kind,0,0,600,230,time);if(kind==='arena'&&HubQA.miniSecret==='hub')HubPresentation.tinySecret(c,'hub',time*1000%5000,600,230,motion);});
  }
  function fitArena(){const vv=window.visualViewport,vw=Math.max(1,Number(vv?.width)||Number(document.documentElement?.clientWidth)||window.innerWidth),vh=Math.max(1,Number(vv?.height)||Number(document.documentElement?.clientHeight)||window.innerHeight),size=state+'|'+Math.round(vw)+'|'+Math.round(vh);if(size===lastSize)return;lastSize=size;resize();if(state!=='PLAYING'||!(vw<920||vh<500))return;const reserve=vh<500?112:162,top=60,scale=Math.min(vw/WIDTH,Math.max(120,vh-reserve-top)/HEIGHT);Object.assign(canvas.style,{width:WIDTH*scale+'px',height:HEIGHT*scale+'px',left:(vw-WIDTH*scale)/2+'px',top:top+(vh-reserve-top-HEIGHT*scale)/2+'px'});}
  function sync(){
    const s=state,show=s==='HUB';screen.hidden=!show;
    if(show){const sig=HubI18n.language+'|'+HubStorage.enabled;if(sig!==signature){signature=sig;renderHub();}drawPreviews();document.getElementById('canvasControls').hidden=true;}
    else signature='';
    play.hidden=s!=='PLAYING'||!small();if(!play.hidden){sticks[1].b.hidden=![0,2,4].includes(mode_idx)||player2.is_bot;hud.textContent=`P1: ${player1.score} · ${[0,2,4].includes(mode_idx)?'P2: '+player2.score+' · ':''}${survived_time} s`;}
    if(s!==lastState){sticks.forEach(j=>j.release());lastState=s;}fitArena();
  }
  const oldDraw=draw;draw=function(){oldDraw();sync();};
  const viewportChanged=()=>{lastSize='';sync();};window.addEventListener('resize',viewportChanged);window.addEventListener('orientationchange',viewportChanged);if(window.visualViewport){window.visualViewport.addEventListener('resize',viewportChanged);window.visualViewport.addEventListener('scroll',viewportChanged);}
  // Native controls handle Space/Enter themselves; game shortcuts must not leak through.
  const invitation=(()=>{const path=String(window.location?.pathname||'').match(/^\/room\/([ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6})\/?$/i);if(path)return path[1].toUpperCase();const hash=String(window.location?.hash||'').match(/^#room=([ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6})$/i);if(hash)return hash[1].toUpperCase();const query=String(window.location?.search||'').match(/[?&]room=([ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6})(?:&|$)/i)?.[1]?.toUpperCase();return /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(query||'')?query:'';})();if(invitation)setTimeout(()=>{if(state==='HUB')HubActions.openOnline('rally',invitation);},0);
  window.DeviceUI={sync,get screen(){return screen;},get active(){return !screen.hidden;},get buttons(){const all=Array.from(screen.querySelectorAll('button'));if(state==='HUB'){const tiles=all.filter(b=>['Ultimate Arena v2','Snake','Neon Breaker','Neon Rally','Orbit Dash','Prism Merge','Cloud Hop'].includes(b.textContent));return [...tiles,...all.filter(b=>!tiles.includes(b))];}return all;},credits:()=>t(21)};
  sync();
})();
